services:
  # Backend FastAPI
  - type: web
    name: projecto-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: projecto-db
          property: connectionString
      # REDIS_URL: set manually if using Upstash Redis (free tier available at upstash.com)
      - key: ADMIN_ACCESS_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://projecto-indol.vercel.app
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: projecto-db
    databaseName: projecto
    plan: free
    region: frankfurt
    ipAllowList: []
# NOTE: Redis is NOT available on Render free tier.
# Use Upstash Redis (free tier at https://upstash.com/) or run without cache.
# Set REDIS_URL env var manually if using Upstash.
