[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "km-backend"
version = "0.1.0"
description = "Personal Knowledge Management - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "pymupdf>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=0.6.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "assemblyai>=0.17.0",
    "openai>=1.0.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "app/services/transcripts/debate_compare.py",
    "app/services/transcripts/debate_transcriber.py",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*", ".cache*", ".venv*"]
