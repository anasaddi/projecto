name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MAX_JS_CHUNK_KB: "220"
  MIN_BACKEND_COVERAGE: "35"

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Check frontend bundle budget
        run: npm run check:bundle
        working-directory: frontend
        env:
          MAX_JS_CHUNK_KB: ${{ env.MAX_JS_CHUNK_KB }}

      - name: Frontend summary
        if: always()
        run: |
          echo "## Frontend CI" >> $GITHUB_STEP_SUMMARY
          echo "- Build: eseguito" >> $GITHUB_STEP_SUMMARY
          echo "- Budget chunk JS massimo: ${MAX_JS_CHUNK_KB} KB" >> $GITHUB_STEP_SUMMARY
          echo "- Check bundle: eseguito" >> $GITHUB_STEP_SUMMARY

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: backend

      - name: Run backend tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=${MIN_BACKEND_COVERAGE} -q
        working-directory: backend

      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

      - name: Backend summary
        if: always()
        run: |
          echo "## Backend CI" >> $GITHUB_STEP_SUMMARY
          echo "- Test backend: eseguiti" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage minima richiesta: ${MIN_BACKEND_COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "- Report XML coverage: caricato come artifact" >> $GITHUB_STEP_SUMMARY
